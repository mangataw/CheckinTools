name: Daily check-in

on:
  schedule:
    # GitHub cron uses UTC: 01:00/06:00 = 09:00/14:00 Asia/Shanghai.
    - cron: "0 1 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: Site to run
        type: choice
        required: true
        default: all
        options:
          - all
          - javbus
          - fuliba
          - v2ex

permissions:
  contents: read

concurrency:
  group: daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Prepare daily state key
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          checkin_date=$(TZ=Asia/Shanghai date +%F)
          echo "CHECKIN_DATE=${checkin_date}" >> "${GITHUB_ENV}"
      - name: Restore daily account state
        if: github.event_name == 'schedule'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .checkin-state.json
          key: checkin-state-${{ env.CHECKIN_DATE }}-${{ github.run_id }}
          restore-keys: |
            checkin-state-${{ env.CHECKIN_DATE }}-
      - name: Install project
        run: python -m pip install --disable-pip-version-check .
      - name: Run check-ins
        env:
          JAVBUS_COOKIES: ${{ secrets.JAVBUS_COOKIES }}
          FULIBA_USERNAMES: ${{ secrets.FULIBA_USERNAMES }}
          FULIBA_COOKIES: ${{ secrets.FULIBA_COOKIES }}
          V2EX_USERNAMES: ${{ secrets.V2EX_USERNAMES }}
          V2EX_COOKIES: ${{ secrets.V2EX_COOKIES }}
          DINGTALK_ACCESS_TOKEN: ${{ secrets.DINGTALK_ACCESS_TOKEN }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          CHECKIN_NOTIFY_CHANNEL: ${{ vars.CHECKIN_NOTIFY_CHANNEL }}
          CHECKIN_NOTIFY_MODE: ${{ vars.CHECKIN_NOTIFY_MODE }}
        shell: bash
        run: |
          args=(run --site "${{ inputs.site || 'all' }}")
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            args+=(--state-file .checkin-state.json --state-date "${CHECKIN_DATE}")
          fi
          python -m checkin_tools "${args[@]}"
